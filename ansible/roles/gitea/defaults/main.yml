gitea_hostname: git.panahi-systems.com
# Fields of secret/gitea in OpenBao (group_vars/all/secrets.yml).
gitea_secret_key: "{{ vault_gitea_secrets.secret_key }}"
gitea_internal_token: "{{ vault_gitea_secrets.internal_token }}"
gitea_jwt_secret: "{{ vault_gitea_secrets.jwt_secret }}"
