---
# Root directory on the backup VM under which all backup artifacts live.
backup_root: /var/backups/homelab

# Home Assistant Core API, reached directly over the LAN from the backup VM
# (haos, not the homeassistant alias, which goes through nginx-internal).
# Resolved by the router's dnsmasq (ansible/dns/records.yml).
backup_ha_url: "http://haos.home.arpa:8123"

# Long-lived access token for the HA Core API.
# secret/home-assistant in OpenBao (group_vars/all/secrets.yml).
backup_ha_token: "{{ vault_ha_token }}"

# The `backup` integration agent that represents HA's own local storage.
# Confirmed empirically via the `backup/agents/info` WS command against a
# live HAOS instance -- do not assume this without checking, it is not
# documented anywhere obvious.
backup_ha_agent_id: hassio.local

# How long (seconds) to wait for HA to finish generating a backup before
# giving up. A full backup (config + database + folders) can take several
# minutes, so this is intentionally generous.
backup_ha_create_timeout: 1800

# The docker VM (homelab2) that hosts party-time-db, reached over SSH.
# Internal DNS: the record is pinned to the VM's fixed lab address in
# ansible/dns/records.yml.
backup_docker_host: docker.home.arpa
backup_docker_user: ubuntu

# SSH private key used to pull the Postgres dump. Public key must be
# authorized on backup_docker_user@backup_docker_host.
# secret/backup in OpenBao (group_vars/all/secrets.yml).
backup_ssh_key_path: /root/.ssh/id_backup

# Postgres databases on the docker VM to pull, one dump each per run.
#   name       file prefix: <name>-<timestamp>.dump in {{ backup_root }}/postgres
#   container  the postgres container (POSTGRES_USER is read inside it)
#   database   database to dump
#   schema     dump only this schema; "" dumps the whole database
#   env_file   the app's secrets file on the VM, copied alongside (best-effort)
#              into postgres/env/<env_prefix>-<timestamp>; without it a dump
#              can't be restored into a working app
# party-time's app data lives in the "party_time" schema, not "public" --
# pg_dump must be told this explicitly or the dump will silently contain
# nothing. Its file names are unchanged from before this list existed.
backup_pg_targets:
  - name: party_time
    container: party-time-db
    database: party_time
    schema: party_time
    env_file: /opt/party-time/.env.prod
    env_prefix: env.prod
  # Trip planner webapp (trip-planning repo, deploy/docker-compose.prod.yml).
  # Its tables are in "public".
  - name: trips
    container: trips-db
    database: trips
    schema: ""
    env_file: /opt/trips/.env.prod
    env_prefix: trips-env.prod

# Retention, in days, for locally-pruned backup copies.
backup_ha_retention_days: 14
backup_pg_retention_days: 30

# systemd OnCalendar expressions for the backup timers.
backup_ha_oncalendar: "*-*-* 03:15:00"
backup_pg_oncalendar: "*-*-* 03:45:00"
