---
# Host-level config for the Proxmox hypervisors. VM lifecycle stays in
# Terraform; this is only what has to live on the hosts themselves.

- name: Install ethtool
  ansible.builtin.apt:
    name: ethtool
    state: present

- name: Install the NIC offload unit
  ansible.builtin.template:
    src: nic-offload@.service.j2
    dest: /etc/systemd/system/nic-offload@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reapply NIC offloads

# Starting the unit applies the change immediately. ethtool -K can bounce the
# link for a second, so expect a brief blip on the first run.
- name: Enable and start the offload unit for each NIC
  ansible.builtin.systemd:
    name: "nic-offload@{{ item }}.service"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ proxmox_host_offload_off_nics }}"
  # In --check the unit file above is never written, so systemd can't find it.
  ignore_errors: "{{ ansible_check_mode }}"

# Neither host has a subscription, so the enterprise repos 401 and break
# `apt update`. Keep them commented out (not deleted, so pve-manager upgrades
# find their conffile unchanged) and use pve-no-subscription instead. Only the
# source lists change here; nothing is installed or upgraded.
- name: Comment out the Proxmox enterprise repos
  ansible.builtin.lineinfile:
    path: "/etc/apt/sources.list.d/{{ item.file }}"
    regexp: '^#?\s*deb\s+{{ item.repo | regex_escape }}\s*$'
    line: "# deb {{ item.repo }}"
  loop:
    - file: pve-enterprise.list
      repo: "https://enterprise.proxmox.com/debian/pve {{ ansible_facts['distribution_release'] }} pve-enterprise"
    - file: ceph.list
      repo: "https://enterprise.proxmox.com/debian/ceph-quincy {{ ansible_facts['distribution_release'] }} enterprise"
  loop_control:
    label: "{{ item.file }}"

# A plain copy rather than apt_repository (deprecated) or deb822_repository
# (would rewrite the file in .sources format), so the hand-made file matches.
- name: Add the pve-no-subscription repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-no-subscription.list
    content: |
      deb http://download.proxmox.com/debian/pve {{ ansible_facts['distribution_release'] }} pve-no-subscription
    owner: root
    group: root
    mode: "0644"

# cloudflared's QUIC transport wants ~7 MB UDP socket buffers. The cap is a
# host-kernel setting that an unprivileged LXC (nginx-cloudflared) can't raise
# itself, so it is set here. Without it the tunnel still works, but logs a
# buffer warning and gets less throughput.
- name: Raise the UDP socket buffer cap for cloudflared in LXCs
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "{{ proxmox_host_udp_buffer_max }}"
    sysctl_file: /etc/sysctl.d/90-homelab-udp-buffers.conf
    reload: true
  loop:
    - net.core.rmem_max
    - net.core.wmem_max

- name: Configure nightly guest backups
  ansible.builtin.include_tasks: backups.yml
  when: proxmox_backup_disk_node | length > 0
