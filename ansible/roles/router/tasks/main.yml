---
# Turns the router VM into an L3 gateway for the lab subnet: kernel forwarding
# plus an nftables ruleset that masquerades lab traffic onto the LAN.
#
# Addressing is NOT handled here — Terraform's cloud-init network-config owns the
# two IPs on the single NIC (see terraform/router.tf).

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true

# ufw would fight nftables for the same ruleset. This VM is a dedicated router,
# so remove it rather than trying to keep the two in sync.
- name: Remove ufw (nftables owns the firewall on this host)
  ansible.builtin.apt:
    name: ufw
    state: absent
    purge: true

- name: Enable IPv4 forwarding and disable ICMP redirects
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-lab-router.conf
    sysctl_set: true
    reload: true
  loop:
    # Without this the VM drops anything not addressed to itself.
    - { name: net.ipv4.ip_forward, value: "1" }
    # Lab and LAN share one NIC, so forwarded traffic leaves the interface it
    # arrived on. Don't hand out redirects that would route lab hosts around us.
    - { name: net.ipv4.conf.all.send_redirects, value: "0" }
    - { name: net.ipv4.conf.default.send_redirects, value: "0" }

- name: Install nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    # Reject a broken ruleset before it can be written and loaded.
    validate: /usr/sbin/nft --check --file %s
  notify: Reload nftables

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

# ── Internal DNS ─────────────────────────────────────────────────────────────
# dnsmasq serves the zone in ansible/dns/records.yml to the LAN and the lab, and
# forwards everything else upstream. With router_dns_backend: pihole, Pi-hole's
# pihole-FTL (dnsmasq plus blocklists) does that job instead, loading the same
# lab.conf. See docs/internal-dns.md.

- name: Check DNS records
  ansible.builtin.assert:
    that:
      # Names must be unique across hosts and aliases.
      - _dns_names | length == _dns_names | unique | length
      # dnsmasq only follows a CNAME to a name it serves itself.
      - (router_dns_aliases + router_dns_external_aliases) | map(attribute='target') | difference(router_dns_hosts | map(attribute='name')) | length == 0
      # External names are full names outside the zone.
      - router_dns_external_aliases | map(attribute='name') | select('search', '\\.' ~ router_dns_domain ~ '$') | list | length == 0
    fail_msg: >-
      ansible/dns/records.yml: names must be unique, every alias target must
      be a name under router_dns_hosts, and external aliases must be full names
      outside the zone.
  vars:
    _dns_names: "{{ (router_dns_hosts + router_dns_aliases) | map(attribute='name') | list }}"
  when: router_dns_enabled

# dnsmasq-base is the binary alone (no service), so the config can be written and
# validated before either DNS service starts for the first time. Pi-hole runs
# its own build of dnsmasq (pihole-FTL), but lab.conf is plain dnsmasq syntax,
# so this binary validates it for both backends.
- name: Install dnsmasq binary
  ansible.builtin.apt:
    name: dnsmasq-base
    state: present
  when: router_dns_enabled

- name: Create dnsmasq config directory
  ansible.builtin.file:
    path: /etc/dnsmasq.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: router_dns_enabled

- name: Check which DNS services are installed
  ansible.builtin.service_facts:
  when: router_dns_enabled

# Only one of dnsmasq and pihole-FTL can hold port 53. Stopping the old one
# here starts a short DNS outage that ends when the new one starts below.
- name: Stop the standalone dnsmasq service (Pi-hole replaces it)
  ansible.builtin.systemd:
    name: dnsmasq
    state: stopped
    enabled: false
    masked: true
  when:
    - router_dns_enabled
    - router_dns_backend == 'pihole'
    - "'dnsmasq.service' in ansible_facts.services"

- name: Stop Pi-hole (standalone dnsmasq replaces it)
  ansible.builtin.systemd:
    name: pihole-FTL
    state: stopped
    enabled: false
  when:
    - router_dns_enabled
    - router_dns_backend == 'dnsmasq'
    - "'pihole-FTL.service' in ansible_facts.services"

- name: Install and configure Pi-hole
  ansible.builtin.include_role:
    name: pihole
  when:
    - router_dns_enabled
    - router_dns_backend == 'pihole'

- name: Install dnsmasq config and records
  ansible.builtin.template:
    src: dnsmasq-lab.conf.j2
    dest: /etc/dnsmasq.d/lab.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/dnsmasq --test --conf-file=%s
  notify: Restart DNS
  when: router_dns_enabled

- name: Install the standalone dnsmasq service
  when:
    - router_dns_enabled
    - router_dns_backend == 'dnsmasq'
  block:
    # Undo the mask from a Pi-hole rollout before the package tries to start it.
    - name: Unmask dnsmasq
      ansible.builtin.systemd:
        name: dnsmasq
        masked: false
      when: "'dnsmasq.service' in ansible_facts.services"

    - name: Install dnsmasq service
      ansible.builtin.apt:
        name: dnsmasq
        state: present

    # Ubuntu's dnsmasq unit registers 127.0.0.1 with systemd-resolved as the host's
    # nameserver unless lo is excluded. dnsmasq doesn't listen there (see
    # router_dns_listen_addresses), so without this the router can't resolve names.
    - name: Keep dnsmasq from taking over the router's own resolver
      ansible.builtin.lineinfile:
        path: /etc/default/dnsmasq
        regexp: '^#?\s*DNSMASQ_EXCEPT='
        line: 'DNSMASQ_EXCEPT="lo"'
      notify: Restart DNS

- name: Apply DNS changes now
  ansible.builtin.meta: flush_handlers

- name: Enable and start the DNS service
  ansible.builtin.systemd:
    name: "{{ _router_dns_service }}"
    enabled: true
    state: started
  when: router_dns_enabled
