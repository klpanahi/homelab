---
# restic REST server on the docker VM (homelab2): the off-host target for the
# Immich VM's backups (homelab1). Repositories live on the second disk from
# terraform/docker.tf (docker_restic_disk_gb).
restic_server_image: docker.io/restic/rest-server:0.14.0
restic_server_device: /dev/vdb
restic_server_data: /srv/restic
restic_server_port: 8000

# One login per client. --private-repos limits each one to /<user>/, so the
# immich login can only reach its own repository.
restic_server_users:
  - name: immich
    password: "{{ vault_restic_server_password }}"
