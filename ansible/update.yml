---
# Upgrade all packages on every managed VM.
# Run with: ansible-playbook update.yml
#
# Uses serial: 1 so VMs update one at a time — avoids taking everything offline
# simultaneously if a service restart is triggered mid-upgrade.
#
# Note: this includes the lab router VM, so a reboot here briefly cuts lab-subnet
# traffic (docs/lab-subnet.md).

- name: Update packages on all managed VMs
  hosts: tag_ansible
  become: true
  serial: 1
  tasks:
    # Upgrade cloudflared on its own, before the dist upgrade, so the change is
    # visible here: a dist upgrade pulls the new package but nothing restarts
    # the tunnel, leaving the old binary running until a reboot.
    - name: Upgrade cloudflared to the latest release
      ansible.builtin.apt:
        name: cloudflared
        state: latest
        update_cache: true
        cache_valid_time: 3600
      register: cloudflared_upgrade
      when: "'tag_cloudflared' in group_names"

    - name: Restart cloudflared after an upgrade
      ansible.builtin.systemd:
        name: cloudflared
        state: restarted
      when: cloudflared_upgrade is changed

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        cache_valid_time: 3600

    - name: Remove unused packages
      ansible.builtin.apt:
        autoremove: true

    - name: Reboot if required
      ansible.builtin.reboot:
        msg: "Rebooting after package upgrade"
        reboot_timeout: 300
      when: ansible_facts.get('ansible_reboot_required', false)
