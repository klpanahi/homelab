---
# Secrets live in OpenBao (docs/openbao.md), edited in its web UI. Every value is
# fetched when a play first uses it, with the operator's `bao login` token. This
# shells out to the bao CLI rather than using community.hashi_vault: that needs
# hvac in Homebrew's Ansible venv, and crashes forked workers on macOS unless
# no_proxy is set in every shell that runs a play.
#
# The vault_ names are kept so the roles don't need to know where a value is from.
bao_kv_get: BAO_ADDR=https://openbao.panahi-systems.com bao kv get -format=json -mount=secret

vault_ha_token: "{{ (lookup('ansible.builtin.pipe', bao_kv_get ~ ' home-assistant') | from_json).data.data.token }}"
vault_backup_ssh_private_key: "{{ (lookup('ansible.builtin.pipe', bao_kv_get ~ ' backup') | from_json).data.data.ssh_private_key }}"
vault_immich_db_passwords: "{{ (lookup('ansible.builtin.pipe', bao_kv_get ~ ' immich-db') | from_json).data.data }}"
vault_immich_restic_password: "{{ (lookup('ansible.builtin.pipe', bao_kv_get ~ ' immich-restic') | from_json).data.data.password }}"
vault_restic_server_password: "{{ (lookup('ansible.builtin.pipe', bao_kv_get ~ ' restic-server') | from_json).data.data.password }}"
vault_cloudflare_dns_token: "{{ (lookup('ansible.builtin.pipe', bao_kv_get ~ ' cloudflare') | from_json).data.data.dns_token }}"
vault_cloudflare_tunnel_token: "{{ (lookup('ansible.builtin.pipe', bao_kv_get ~ ' cloudflare') | from_json).data.data.tunnel_token }}"
vault_pihole_password: "{{ (lookup('ansible.builtin.pipe', bao_kv_get ~ ' pihole') | from_json).data.data.password }}"
