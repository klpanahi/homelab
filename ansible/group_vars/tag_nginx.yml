# Variables for the tag_nginx group (VMs tagged "nginx" in Proxmox).
# Consumed by the geerlingguy.nginx role.
#
# Full variable reference:
#   https://github.com/geerlingguy/ansible-role-nginx#role-variables

nginx_remove_default_vhost: true

# party-time's vhost, upstream (public_backend -> docker.local:8080), and
# static root (/var/www/invitee-ui) now live in the party-time repo
# (deploy/nginx/public.conf) and are applied by that repo's
# deploy/party-time.yml. homelab only installs and baseline-configures nginx
# here (see site.yml) — it no longer defines any party-time-specific vhost.
