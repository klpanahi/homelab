# Variables for the tag_nginx-internal group (VMs tagged "nginx-internal" in Proxmox).
# Consumed by the geerlingguy.nginx role.
# This VM is LAN-only — no Cloudflare tunnel. Serves the admin UI and proxies
# the admin API to the backend Docker VM by its internal DNS name.

nginx_remove_default_vhost: true

# party-time's vhost, upstream (admin_backend -> docker.home.arpa:8081), and
# static root (/var/www/admin-ui) now live in the party-time repo
# (deploy/nginx/admin.conf) and are applied by that repo's
# deploy/party-time.yml. homelab only installs and baseline-configures nginx
# here (see site.yml) — it no longer defines any party-time-specific vhost.

# Personal Immich (docs/immich.md). Phones and laptops reach this through the
# router's port 80/443 forward on 192.168.68.100 (photos.home.arpa is an alias
# to router in ansible/dns/records.yml). LAN and WireGuard only.
# Plain HTTP for now: home.arpa can't get a public certificate.
nginx_vhosts:
  - listen: "80"
    server_name: "photos.home.arpa"
    filename: "immich-personal.conf"
    extra_parameters: |
      # Settings from https://docs.immich.app/administration/reverse-proxy
      client_max_body_size 50000M;
      proxy_request_buffering off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      send_timeout 600s;

      location / {
          proxy_pass http://10.10.10.50:2283;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_redirect off;
      }

  # Links page (ansible/templates/links/index.html.j2), rendered from
  # homepage_links below by site.yml. LAN and WireGuard only.
  - listen: "80"
    server_name: "links.home.arpa"
    filename: "links.conf"
    root: "/var/www/links"
    index: "index.html"

# Everything the homelab serves, shown at http://links.home.arpa. When you add a
# website (docs/internal-dns.md), add it here too.
homepage_links:
  - name: Proxmox
    links:
      - { name: homelab1, url: "https://homelab1.home.arpa:8006", note: "Proxmox node (self-signed cert)" }
      - { name: homelab2, url: "https://homelab2.home.arpa:8006", note: "Proxmox node (self-signed cert)" }
  - name: Home
    links:
      - { name: Home Assistant, url: "http://homeassistant.home.arpa:8123", note: "Smart home" }
      - { name: Photos, url: "http://photos.home.arpa", note: "Personal Immich" }
      - { name: Party Time admin, url: "http://partytime.home.arpa", note: "Event admin UI" }
  - name: Public (Cloudflare tunnel)
    links:
      - { name: Party Time, url: "https://party-time.panahi-systems.com", note: "Invitee site" }
      - { name: Austin's Photos, url: "https://austins-photos.panahi-systems.com", note: "Austin's Immich" }
      - { name: Shared Photos, url: "https://immich-shared.panahi-systems.com", note: "Immich share links" }
