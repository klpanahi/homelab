# Variables for the tag_nginx-internal group (VMs tagged "nginx-internal" in Proxmox).
# Consumed by the geerlingguy.nginx role.
# This VM is LAN-only — no Cloudflare tunnel. Serves the admin UI and proxies
# the admin API to the backend Docker VM via mDNS hostname.

nginx_remove_default_vhost: true

nginx_upstreams:
  - name: admin_backend
    servers:
      - "docker.local:8081"

nginx_vhosts:
  - listen: "80 default_server"
    server_name: "_"
    root: "/var/www/admin-ui"
    index: "index.html"
    filename: "party-time-admin.conf"
    extra_parameters: |
      location /admin {
          proxy_pass         http://admin_backend;
          proxy_set_header   Host              $host;
          proxy_set_header   X-Real-IP         $remote_addr;
          proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;
      }
      location / {
          try_files $uri $uri/ /index.html;
      }
