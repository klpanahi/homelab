[defaults]
inventory           = inventory/
roles_path          = roles
collections_path    = collections
host_key_checking   = False
remote_user         = ubuntu
private_key_file    = ~/.ssh/id_ed25519
interpreter_python  = auto_silent

[inventory]
enable_plugins = community.proxmox.proxmox, yaml
# Without this, a failed OpenBao lookup leaves the inventory empty, every play is
# skipped and ansible-playbook exits 0.
any_unparsed_is_failed = true
