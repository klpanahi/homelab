# Proxmox dynamic inventory.
#
# homelab1 and homelab2 form one Proxmox cluster, so this single source — the
# cluster API on homelab2 — sees the VMs on both nodes. See docs/cluster.md.
#
# VMs are discovered from the Proxmox API and grouped by their Proxmox tags
# (set in Terraform). The nginx VM is tagged "nginx", so it lands in the
# tag_nginx group that site.yml targets. ansible_host is resolved from the IP
# the QEMU guest agent reports — no static IP files to maintain.
#
# Credentials reuse the same Proxmox API token Terraform uses (see
# terraform.tfvars' proxmox_api_token — currently root@pam!terraform). The user
# and token_id below MUST match that token's user@realm and token id, or the API
# returns 401 "no such user".
#
# The token secret is read from the vaulted group_vars/all/vault.yml via an
# ansible.builtin.unvault lookup (decrypted at parse time via .vault_pass).
# A plain "{{ proxmox_token_secret }}" group var would be undefined here because
# inventory plugins are evaluated BEFORE group_vars are loaded; the lookup reads
# and decrypts the file directly instead.
#
# The API cert is verified against the cluster CA (ansible/files/pve-root-ca.pem).
# The plugin has no CA-path option, so Python's requests library finds that CA
# through REQUESTS_CA_BUNDLE, which the repo's .envrc sets (see docs/cluster.md,
# "TLS certificates"). Without it, inventory parsing fails with
# CERTIFICATE_VERIFY_FAILED.
plugin: community.proxmox.proxmox

url: https://192.168.68.65:8006
user: root@pam
token_id: terraform
token_secret: "{{ (lookup('ansible.builtin.unvault', 'group_vars/all/vault.yml') | ansible.builtin.from_yaml).proxmox_token_secret }}"
validate_certs: true

# want_facts pulls per-VM config + guest-agent data so proxmox_tags_parsed and
# proxmox_agent_interfaces are available below.
want_facts: true

keyed_groups:
  # "nginx" -> tag_nginx, "ansible" -> tag_ansible
  - key: proxmox_tags_parsed
    prefix: tag
    separator: "_"

compose:
  # VMs: the first non-loopback IPv4 the QEMU guest agent reports becomes the
  # SSH target. proxmox_agent_interfaces entries look like:
  #   {name: ens18, mac-address: ..., ip-addresses: ["192.168.68.101/24", "fe80::.../64"]}
  # so: drop the loopback iface, flatten the "ip/prefix" strings, drop IPv6
  # (contains ':') and 127.x, then strip the /prefix.
  #
  # LXCs have no guest agent, so without the else-branch they would silently
  # drop out of every play. Their address is the static ip= in net0 (set by
  # Terraform), which the plugin returns either as the raw config string or
  # already parsed into a dict, depending on the collection version.
  ansible_host: >-
    (proxmox_agent_interfaces
     | rejectattr('name', 'equalto', 'lo')
     | map(attribute='ip-addresses') | flatten
     | reject('search', ':')
     | reject('search', '^127\.')
     | map('regex_replace', '/.*$', '') | first)
    if proxmox_agent_interfaces is defined else
    ((proxmox_net0.ip if proxmox_net0 is mapping else
      (proxmox_net0 | regex_search('(?:^|,)ip=([^,]+)', '\\1') | first))
     | regex_replace('/.*$', ''))

  # The Ubuntu LXC template has no ubuntu user, and Proxmox installs the
  # Terraform SSH key for root, so LXCs are reached as root. This is set here
  # rather than in ansible/group_vars because group_vars next to site.yml are
  # not loaded for playbooks elsewhere, such as party-time's deploy.
  ansible_user: "'root' if proxmox_vmtype == 'lxc' else 'ubuntu'"
