# Proxmox dynamic inventory — second host: homelab1.
#
# homelab2 (see inventory/proxmox.yml) and homelab1 are two standalone Proxmox
# hosts — they are NOT clustered, so there is no single Proxmox API that sees
# both hosts' VMs. Each host needs its own inventory source pointed at its own
# API endpoint, and ansible.cfg is configured to load the whole inventory/
# directory so both sources' tag_* groups merge into one host list.
#
# VMs are discovered from the Proxmox API and grouped by their Proxmox tags
# (set in Terraform). The backup VM is tagged "ansible" and "backup", so it
# lands in tag_ansible and tag_backup, same merging behavior as homelab2's
# VMs. ansible_host is resolved from the IP the QEMU guest agent reports — no
# static IP files to maintain.
#
# Credentials use homelab1's OWN Proxmox API token (root@pam!terraform on
# homelab1 — a separate token from homelab2's, since the hosts aren't
# clustered and don't share a user/token database). user and token_id below
# MUST match that token's user@realm and token id, or the API returns 401
# "no such user".
#
# The token secret is read from the vaulted group_vars/all/vault.yml via an
# ansible.builtin.unvault lookup (decrypted at parse time via .vault_pass).
# A plain "{{ proxmox_token_secret_homelab1 }}" group var would be undefined
# here because inventory plugins are evaluated BEFORE group_vars are loaded;
# the lookup reads and decrypts the file directly instead. Note the key name
# is proxmox_token_secret_homelab1, distinct from homelab2's
# proxmox_token_secret, since both live in the same vault file.
plugin: community.proxmox.proxmox

url: https://192.168.68.75:8006
user: root@pam
token_id: terraform
token_secret: "{{ (lookup('ansible.builtin.unvault', 'group_vars/all/vault.yml') | ansible.builtin.from_yaml).proxmox_token_secret_homelab1 }}"
validate_certs: false

# want_facts pulls per-VM config + guest-agent data so proxmox_tags_parsed and
# proxmox_agent_interfaces are available below.
want_facts: true

keyed_groups:
  # "backup" -> tag_backup, "ansible" -> tag_ansible
  - key: proxmox_tags_parsed
    prefix: tag
    separator: "_"

compose:
  # First non-loopback IPv4 the guest agent reports becomes the SSH target.
  # proxmox_agent_interfaces entries look like:
  #   {name: ens18, mac-address: ..., ip-addresses: ["192.168.68.101/24", "fe80::.../64"]}
  # so: drop the loopback iface, flatten the "ip/prefix" strings, drop IPv6
  # (contains ':') and 127.x, then strip the /prefix.
  ansible_host: >-
    proxmox_agent_interfaces | default([])
    | rejectattr('name', 'equalto', 'lo')
    | map(attribute='ip-addresses') | flatten
    | reject('search', ':')
    | reject('search', '^127\.')
    | map('regex_replace', '/.*$', '') | first
