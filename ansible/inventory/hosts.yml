# Static inventory for the Proxmox hypervisors themselves.
#
# The dynamic inventory (proxmox.yml, homelab1.proxmox.yml) names the hosts in
# its proxmox_nodes group but gives them no address. This file adds their LAN
# addresses (Deco reservations, see README.md's address table). Proxmox has no "ubuntu" user,
# so these connect as root.
all:
  children:
    proxmox_hosts:
      hosts:
        homelab1:
          ansible_host: 192.168.68.75
        homelab2:
          ansible_host: 192.168.68.65
      vars:
        ansible_user: root
