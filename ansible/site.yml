---
# Top-level playbook. Run with: ansible-playbook site.yml
#
# Hosts are discovered via the Proxmox dynamic inventory and grouped by tag.
# tag_ansible    == all Proxmox-managed VMs (every VM carries the "ansible" tag).
# tag_nginx      == VMs tagged "nginx" in Proxmox (see terraform/nginx.tf).
# tag_cloudflared == VMs that should run a Cloudflare tunnel (subset of nginx VMs
#                   that are externally exposed; internal-only nginx VMs omit this tag).
# tag_router     == the lab router/NAT gateway VM (see terraform/router.tf).
# proxmox_hosts  == the hypervisors (static, inventory/hosts.yml).

# The Proxmox hypervisors themselves (inventory/hosts.yml), not their VMs.
# Host-level fixes that would otherwise be hand edits on each box.
- name: Configure Proxmox hosts
  hosts: proxmox_hosts
  roles:
    - proxmox_host

# Every managed VM except the router, which runs the resolver itself.
- name: Common setup for all managed VMs
  hosts: tag_ansible:!tag_router
  become: true
  tasks:
    # Names are served by the router's dnsmasq under home.arpa
    # (docs/internal-dns.md). mDNS (.local via avahi) was retired on 2026-10-30:
    # it broke repeatedly (name conflicts renaming hosts to *-2.local, stale
    # leases, a pinned /etc/hosts line) and nothing uses .local names any more.
    # Purging libnss-mdns also takes mdns4_minimal back out of nsswitch.conf.
    # Safe to drop these two tasks once every guest has run them.
    - name: Stop and disable avahi-daemon
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - avahi-daemon.socket
        - avahi-daemon.service
      failed_when: false

    - name: Remove avahi and mDNS name resolution
      ansible.builtin.apt:
        name:
          - avahi-daemon
          - avahi-utils
          - libnss-mdns
        state: absent
        purge: true

    # Send home.arpa lookups to the router's dnsmasq and leave everything else
    # on the VM's existing resolver (8.8.8.8 from terraform *_nameserver). A
    # resolved routing domain works on running VMs without touching the netplan
    # that cloud-init wrote once, and an outage of the router's resolver can only
    # break home.arpa names, never public ones. See docs/internal-dns.md#lab-vms.
    - name: Create the systemd-resolved drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: "0755"

    - name: Route home.arpa lookups to the lab resolver
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/home-arpa.conf
        content: |
          # Managed by homelab ansible/site.yml.
          [Resolve]
          DNS={{ lab_dns_server }}
          Domains=~{{ lab_dns_domain }}
        mode: "0644"
      register: lab_dns_dropin

    # LXC guests need two more pieces to match the VMs. Proxmox writes a plain
    # /etc/resolv.conf (the Terraform nameserver) into the container, which
    # bypasses systemd-resolved and so the home.arpa route above; the
    # .pve-ignore marker stops Proxmox rewriting it at boot. And the
    # networkd file Proxmox generates carries no DNS server, so the drop-in
    # gives eth0 the container's nameserver for everything outside home.arpa,
    # like the netplan config on the VMs.
    - name: Configure systemd-resolved in LXC guests
      when: ansible_facts['virtualization_type'] == 'lxc'
      block:
        - name: Stop Proxmox managing /etc/resolv.conf
          ansible.builtin.copy:
            dest: /etc/.pve-ignore.resolv.conf
            content: ""
            mode: "0644"

        - name: Point /etc/resolv.conf at the systemd-resolved stub
          ansible.builtin.file:
            path: /etc/resolv.conf
            src: /run/systemd/resolve/stub-resolv.conf
            state: link
            force: true

        - name: Create the eth0 networkd drop-in directory
          ansible.builtin.file:
            path: /etc/systemd/network/eth0.network.d
            state: directory
            mode: "0755"

        - name: Give eth0 the container's nameserver
          ansible.builtin.copy:
            dest: /etc/systemd/network/eth0.network.d/dns.conf
            content: |
              # Managed by homelab ansible/site.yml.
              [Network]
              DNS={{ proxmox_nameserver }}
            mode: "0644"
          register: lxc_dns_dropin

        - name: Reload networkd to apply the eth0 nameserver
          ansible.builtin.command: networkctl reload
          when: lxc_dns_dropin.changed
          changed_when: true

    - name: Restart systemd-resolved to pick up the home.arpa route
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
      when: lab_dns_dropin.changed or (lxc_dns_dropin.changed | default(false))

# Lab router/NAT gateway for the routed lab subnet (10.10.10.0/24) that lives on
# the same physical wire as the LAN. Runs first so lab VMs have a working default
# gateway before the plays that configure them. See docs/lab-subnet.md.
- name: Configure the lab router/NAT gateway
  hosts: tag_router
  become: true
  # Internal DNS records the router's dnsmasq serves. See docs/internal-dns.md.
  vars_files:
    - dns/records.yml
  roles:
    - router

# geerlingguy.nginx here is install/baseline configuration only (package
# install, service enablement, removing the stale default vhost). Any
# application-specific vhost — e.g. party-time's — is owned by that
# application's own repo and applied by its own deploy playbook, not here.
- name: Configure nginx web servers
  hosts: tag_nginx
  become: true
  pre_tasks:
    - name: Remove stale default nginx vhost
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default.conf
        state: absent
  roles:
    - geerlingguy.nginx
  tasks:
    - name: Install the home.arpa resolver
      ansible.builtin.include_tasks: tasks/nginx-resolver.yml

- name: Configure Cloudflare tunnels
  hosts: tag_cloudflared
  become: true
  roles:
    - cloudflared

- name: Configure docker hosts
  hosts: tag_docker
  become: true
  roles:
    - geerlingguy.docker
    # Off-host backup target for the Immich VM on homelab1. See docs/immich.md.
    - restic_server
  # roles: run before tasks: in a play, so this lands after geerlingguy.docker
  # has created the ubuntu user / docker group setup, which is fine.
  tasks:
    - name: Install backup VM's SSH public key into ubuntu's authorized_keys
      ansible.posix.authorized_key:
        user: ubuntu
        key: "{{ backup_ssh_public_key }}"
      # Skipped until the real key is set in group_vars/all/vars.yml, so a
      # run before the keypair exists can't write a junk authorized_keys entry.
      when: backup_ssh_public_key | length > 0
      # WARNING: the ubuntu user is in the docker group, which is
      # root-equivalent (docker group members can mount the host filesystem
      # via a container). This key is therefore a root-equivalent credential
      # on this VM. Restricting it with a forced command= in authorized_keys
      # (limiting it to just the pg_dump invocation the backup role needs) is
      # a known follow-up, not yet done.

# Same install/baseline-only role as the tag_nginx play above — party-time's
# admin vhost is applied separately by party-time's deploy/party-time.yml.
- name: Configure internal nginx hosts
  hosts: tag_nginx_internal
  become: true
  # Certificates first: HTTPS vhosts in nginx_vhosts point at their files, and
  # nginx won't start if one is missing. letsencrypt_certificates is in
  # group_vars/tag_nginx_internal.yml.
  pre_tasks:
    - name: Issue Let's Encrypt certificates
      ansible.builtin.include_role:
        name: letsencrypt
  roles:
    - geerlingguy.nginx
  tasks:
    - name: Install the home.arpa resolver
      ansible.builtin.include_tasks: tasks/nginx-resolver.yml

    # The links page at links.home.arpa, rendered from homepage_links in
    # group_vars/tag_nginx_internal.yml. Its vhost is in nginx_vhosts there.
    - name: Create the links page root
      ansible.builtin.file:
        path: /var/www/links
        state: directory
        mode: "0755"

    - name: Render the links page
      ansible.builtin.template:
        src: templates/links/index.html.j2
        dest: /var/www/links/index.html
        mode: "0644"

# Immich photo servers on homelab1 (docs/immich.md). One compose project per
# instance in group_vars/tag_immich.yml, plus a shared ML container and a
# nightly restic backup to the docker VM on homelab2.
- name: Configure Immich hosts
  hosts: tag_immich
  become: true
  roles:
    - geerlingguy.docker
    - immich

# The backup VM lives on homelab1 — deliberately a different physical
# machine from the workloads it backs up (docker VM, Home Assistant), so a
# single host failure can't take out both the data and its backup.
- name: Configure backup hosts
  hosts: tag_backup
  become: true
  roles:
    - backup
