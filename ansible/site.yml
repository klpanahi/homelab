---
# Top-level playbook. Run with: ansible-playbook site.yml
#
# Hosts are discovered via the Proxmox dynamic inventory and grouped by tag.
# tag_ansible    == all Proxmox-managed VMs (every VM carries the "ansible" tag).
# tag_nginx      == VMs tagged "nginx" in Proxmox (see terraform/nginx.tf).
# tag_cloudflared == VMs that should run a Cloudflare tunnel (subset of nginx VMs
#                   that are externally exposed; internal-only nginx VMs omit this tag).

- name: Common setup for all managed VMs
  hosts: tag_ansible
  become: true
  tasks:
    - name: Install avahi-daemon and libnss-mdns for mDNS hostname resolution
      ansible.builtin.apt:
        name:
          - avahi-daemon
          - libnss-mdns
        state: present
        update_cache: true

    - name: Enable and start avahi-daemon
      ansible.builtin.systemd:
        name: avahi-daemon
        enabled: true
        state: started

# geerlingguy.nginx here is install/baseline configuration only (package
# install, service enablement, removing the stale default vhost). Any
# application-specific vhost — e.g. party-time's — is owned by that
# application's own repo and applied by its own deploy playbook, not here.
- name: Configure nginx web servers
  hosts: tag_nginx
  become: true
  pre_tasks:
    - name: Remove stale default nginx vhost
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default.conf
        state: absent
  roles:
    - geerlingguy.nginx

- name: Configure Cloudflare tunnels
  hosts: tag_cloudflared
  become: true
  roles:
    - cloudflared

- name: Configure docker hosts
  hosts: tag_docker
  become: true
  roles:
    - geerlingguy.docker
  # roles: run before tasks: in a play, so this lands after geerlingguy.docker
  # has created the ubuntu user / docker group setup, which is fine.
  tasks:
    - name: Install backup VM's SSH public key into ubuntu's authorized_keys
      ansible.posix.authorized_key:
        user: ubuntu
        key: "{{ backup_ssh_public_key }}"
      # Skipped until the real key is set in group_vars/all/vars.yml, so a
      # run before the keypair exists can't write a junk authorized_keys entry.
      when: backup_ssh_public_key | length > 0
      # WARNING: the ubuntu user is in the docker group, which is
      # root-equivalent (docker group members can mount the host filesystem
      # via a container). This key is therefore a root-equivalent credential
      # on this VM. Restricting it with a forced command= in authorized_keys
      # (limiting it to just the pg_dump invocation the backup role needs) is
      # a known follow-up, not yet done.

# Same install/baseline-only role as the tag_nginx play above — party-time's
# admin vhost is applied separately by party-time's deploy/party-time.yml.
- name: Configure internal nginx hosts
  hosts: tag_nginx_internal
  become: true
  roles:
    - geerlingguy.nginx

# The backup VM lives on homelab1 — deliberately a different physical
# machine from the workloads it backs up (docker VM, Home Assistant), so a
# single host failure can't take out both the data and its backup.
- name: Configure backup hosts
  hosts: tag_backup
  become: true
  roles:
    - backup
